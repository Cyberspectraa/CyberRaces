buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

mixin {
    add sourceSets.main, "cyberraces.refmap.json"
    config "cyberraces.mixins.json"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                cyberraces {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir layout.buildDirectory.dir('generated/beast-assets')
}

def wolfVariantNames = [
    'woods',
    'ashen',
    'black',
    'chestnut',
    'rusty',
    'spotted',
    'striped',
    'snowy'
]

tasks.register('syncBeastVariantAssets') {
    def outputRoot = layout.buildDirectory.dir('generated/beast-assets')
    outputs.dir(outputRoot)

    doLast {
        def outputDir = outputRoot.get().dir(
            'assets/cyberraces/textures/entity/beast'
        ).asFile
        outputDir.mkdirs()

        wolfVariantNames.each { variant ->
            def destination = new File(outputDir, "wolf_${variant}.png")
            if (!destination.exists() || destination.length() == 0L) {
                def source =
                    "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/26.2/" +
                    "assets/minecraft/textures/entity/wolf/wolf_${variant}.png"

                logger.lifecycle("Downloading official Minecraft wolf coat: ${variant}")
                new java.net.URL(source).withInputStream { input ->
                    destination.withOutputStream { output ->
                        output << input
                    }
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://jitpack.io' }

    maven {
        name = 'TheIllusiveC4'
        url = 'https://maven.theillusivec4.top'
    }

    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Generates the production refmap used to remap Mixin targets in an obfuscated Forge client.
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"

    implementation fg.deobf("com.github.Virtuoel:Pehkui:${pehkui_version}")

    // Fairy wings use the real Curios back slot and Icarus' Zanza's Wings.
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:5.8.1+1.20.1")
    compileOnly fg.deobf("curse.maven:icarus-428151:8753894")
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('syncBeastVariantAssets')
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version: forge_version,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs': 'cyberraces.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
